<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shlok AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #4158D0;
            background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .user-message {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            display: flex;
            background: white;
            padding: 5px;
            border-radius: 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        input {
            flex: 1;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            outline: none;
            font-size: 16px;
        }

        button {
            background: #2575fc; 
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">✨ Shlok AI</div>

    <div id="chat-container">
        <div class="message ai-message">
            Namaste Shlok! Main aapka AI assistant hoon. Main aapki kya madad kar sakta hoon?
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Yahan type karein..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (isUser ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, true);
            userInput.value = '';
            setTimeout(() => {
                appendMessage("Shlok, aapka chatbot ab live hone ke liye taiyar hai!", false);
            }, 700);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
